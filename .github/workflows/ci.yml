name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4
      - name: Run bandit
        run: bandit -r app seed.py wsgi.py -ll
      - name: Generate bandit JSON report
        if: always()
        run: bandit -r app seed.py wsgi.py -f json -o bandit-report.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    name: SCA (Dependency-Check + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare dependency inventory
        run: |
          python -m venv /tmp/lab-dependencies
          /tmp/lab-dependencies/bin/pip install -r requirements.txt
          mkdir -p /tmp/lab-scan reports
          /tmp/lab-dependencies/bin/pip freeze > /tmp/lab-scan/requirements.txt
      - name: Install Dependency-Check
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/org/owasp/dependency-check-cli/13.0.0/dependency-check-cli-13.0.0-release.zip \
            -o /tmp/dependency-check.zip
          echo "44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed  /tmp/dependency-check.zip" | sha256sum --check
          unzip -q /tmp/dependency-check.zip -d /tmp
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-${{ runner.os }}-
      - name: Run OWASP Dependency-Check
        run: |
          sh /tmp/dependency-check/bin/dependency-check.sh \
            --project infosec-lab1 --scan /tmp/lab-scan \
            --enableExperimental --format HTML --format JSON \
            --out reports --data "$HOME/.cache/dependency-check" \
            --failOnCVSS 7 --disableOssIndex --disableRetireJs \
            --suppression .github/dependency-check-suppressions.xml \
            --disableHostedSuppressions --disableVersionCheck \
            --nvdDatafeed 'https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz'
      - name: Save vulnerability database
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
      - name: Audit Python dependencies
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --strict -f json -o reports/pip-audit.json
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: reports/
          if-no-files-found: error
