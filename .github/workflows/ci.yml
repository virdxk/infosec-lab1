name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: Run bandit
        run: bandit -r app seed.py wsgi.py -ll -f txt -o bandit-report.txt
      - name: Show bandit report
        if: always()
        run: cat bandit-report.txt
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  sca:
    name: SCA (Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: List all dependencies
        run: |
          pip install -r requirements.txt
          mkdir scan
          pip freeze > scan/requirements.txt
      - name: Install Dependency-Check
        run: |
          curl -sSL -o dc.zip https://repo.maven.apache.org/maven2/org/owasp/dependency-check-cli/13.0.0/dependency-check-cli-13.0.0-release.zip
          unzip -q dc.zip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-
      - name: Run Dependency-Check
        run: |
          bash dependency-check/bin/dependency-check.sh \
            --project infosec-lab1 --scan scan --out reports \
            --enableExperimental --failOnCVSS 7 \
            --disableOssIndex --disableRetireJs \
            --suppression .github/dependency-check-suppressions.xml \
            --data ~/.cache/dependency-check \
            --nvdDatafeed 'https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
